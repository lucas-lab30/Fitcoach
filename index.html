<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCoach</title>
<meta name="description" content="Coach fitness : calories, macros, entraînements et progression.">
<meta name="theme-color" content="#f3f6fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitCoach">
<style>html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}</style>
<style>
:root{--bg:#0d1117;--card:#161c26;--card2:#1e2633;--tx:#eef2f7;--mu:#8b97a8;--ac:#c6ff3d;--acx:#10140a;--bd:#263042;--red:#ff6b5e;--blu:#5ab0ff;--ora:#ffb04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f5f9;--card:#fff;--card2:#e9eef5;--tx:#141a24;--mu:#5d6a7d;--ac:#3a7d00;--acx:#fff;--bd:#d7dfeb}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;font-size:16px}
main{max-width:520px;margin:auto;padding:14px 14px 96px}
h1{font-size:28px;margin:6px 0 12px;letter-spacing:.2px}h2{font-size:18px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:34px;font-weight:700}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px;min-width:0}
.b{background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.b2{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}
.sm{width:auto;padding:8px 12px;font-size:14px}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1}
nav button b{font-size:20px;font-weight:400}nav .on{color:var(--ac)}
#sh .bk{position:fixed;inset:0;background:#000a;z-index:8}#sh .pn{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:9;max-width:520px;margin:auto;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}
.chips{display:flex;gap:6px;margin:6px 0}.chips button{flex:1}.chips .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;align-items:center;margin:6px 0}
.ck{height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;font-size:18px}.ck.d{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#tm{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:var(--ac);color:var(--acx);border-radius:16px;padding:10px 16px;font-weight:700;display:none;justify-content:space-between;align-items:center;z-index:6}
svg text{fill:var(--mu);font-size:10px}
#scn{position:fixed;inset:0;background:#000;z-index:30}
#scn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scn .fr{position:absolute;left:50%;top:40%;width:78%;max-width:340px;aspect-ratio:1.6;transform:translate(-50%,-50%);border:3px solid var(--ac);border-radius:18px;box-shadow:0 0 0 100vmax #0009}
#scn .tp{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
#scn .bt{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#000c;color:#fff;text-align:center}
.bdg{display:inline-block;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:2px 8px;margin:4px 4px 0 0;font-size:13px}
:root:root:root{--bg:#f3f6fb;--card:#fff;--card2:#edf1f8;--tx:#152033;--mu:#6a778c;--ac:#3ddc84;--acx:#08301a;--bd:#e3e9f3;--red:#ff5c70;--blu:#2f7bff;--ora:#ff9a2e;--vio:#7b5cff}
body{background:#f3f6fb linear-gradient(180deg,#e3f8ec,#f3f6fb 300px) no-repeat}
.c{border-color:transparent;border-radius:22px;box-shadow:0 6px 20px #1b2b4a14;animation:pop .35s both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.b{background:linear-gradient(135deg,#b9f53d,#3ddc84);box-shadow:0 6px 16px #3ddc8444;border-radius:16px;padding:14px 16px}
.b2{background:#fff}nav{background:#ffffffee;backdrop-filter:blur(10px)}nav .on{color:#12a45c}
.hero{background:linear-gradient(135deg,#19c37d,#2f7bff 70%,#7b5cff);color:#fff;border:0}.hero .mu{color:#ffffffcc}.hero .big small{font-size:15px;opacity:.85;font-weight:500}.hero .bar{background:#fff4}.hero .bar i{background:#fff!important}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
</style></head><body>
<main id="app"></main><div id="tm"></div><div id="sh"></div>
<nav id="nav"></nav>
<script>
const F=[["Poulet (blanc, cuit)","Viandes",165,31,0,3.6,0],["Boeuf haché 5%","Viandes",137,21,0,5,0],["Saumon","Poissons",208,20,0,13,0],["Thon en boîte","Poissons",116,26,0,1,0],["Oeuf entier","Oeufs",143,13,1,10,0],["Riz blanc cuit","Féculents",130,2.7,28,.3,.4],["Pâtes cuites","Féculents",158,5.8,31,.9,1.8],["Pomme de terre","Féculents",86,2,20,.1,2.2],["Flocons d'avoine","Féculents",372,13,60,7,10],["Pain complet","Féculents",247,13,41,3.4,7],["Brocoli","Légumes",34,2.8,7,.4,2.6],["Carotte","Légumes",41,.9,10,.2,2.8],["Tomate","Légumes",18,.9,3.9,.2,1.2],["Banane","Fruits",89,1.1,23,.3,2.6],["Pomme","Fruits",52,.3,14,.2,2.4],["Skyr nature","Laitages",63,11,4,.2,0],["Yaourt grec","Laitages",97,9,4,5,0],["Lait demi-écrémé","Laitages",46,3.4,4.8,1.6,0],["Fromage blanc 0%","Laitages",46,8,4,.2,0],["Amandes","Oléagineux",579,21,22,50,12],["Beurre de cacahuète","Oléagineux",588,25,20,50,6],["Huile d'olive","Matières grasses",884,0,0,100,0],["Whey protéine","Compléments",380,78,8,6,0],["Lentilles cuites","Légumineuses",116,9,20,.4,8],["Avocat","Fruits",160,2,9,15,7]];
const MEALS=[["bk","Petit-déjeuner"],["lu","Déjeuner"],["di","Dîner"],["sn","Collation"]];
const dstr=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const TODAY=dstr(0),ACT=["Sédentaire","Légèrement actif","Modérément actif","Très actif","Extrêmement actif"],MUL=[1.2,1.375,1.55,1.725,1.9],GL=["Perte de poids","Maintien","Prise de masse"];
let S,view="dash",sess=null,rng=30,exSel="",ti=null;
function demo(){const w=[];for(let i=89;i>=0;i--)if(i%2==0)w.push({d:dstr(i),v:+(74.2-(89-i)*.025+Math.sin(i)*.25).toFixed(1)});w[w.length-1].v=72;
const mk=(n,s,r,wt,rest)=>({n,sets:s,reps:r,w:wt,rest}),logs=[];
const P=[{name:"PUSH",ex:[mk("Développé couché",3,10,80,90),mk("Développé incliné",3,10,30,90),mk("Élévations latérales",3,12,10,60),mk("Extension triceps",3,12,25,60)]},{name:"PULL",ex:[mk("Tractions",3,8,0,90),mk("Tirage vertical",3,10,55,90),mk("Rowing",3,10,60,90),mk("Curl biceps",3,12,14,60)]},{name:"LEGS",ex:[mk("Squat",4,8,90,120),mk("Presse",3,12,140,90),mk("Leg curl",3,12,40,60),mk("Mollets",4,15,60,45)]}];
for(let k=0;k<9;k++){const p=P[k%3],bump=Math.floor(k/3)*2.5;logs.push({d:dstr((8-k)*3+1),p:p.name,dur:55+k%3*4,ex:p.ex.map(e=>({n:e.n,sets:Array.from({length:e.sets},(_,j)=>({w:+(e.w+bump-(j==2?2.5:0)).toFixed(1),r:e.reps-(j==2?1:0)}))}))})}
const m={};m[TODAY]=[["bk","Flocons d'avoine",60],["bk","Skyr nature",150],["bk","Banane",120],["lu","Poulet (blanc, cuit)",150],["lu","Riz blanc cuit",200],["lu","Brocoli",150],["sn","Amandes",25]].map(a=>({m:a[0],f:a[1],g:a[2]}));
for(let i=1;i<=7;i++)m[dstr(i)]=[["bk","Flocons d'avoine",70],["lu","Pâtes cuites",300],["lu","Poulet (blanc, cuit)",160],["di","Saumon",150],["di","Pomme de terre",250],["sn","Yaourt grec",150]].map(a=>({m:a[0],f:a[1],g:a[2]}));
return{profile:{sex:"m",age:28,h:175,w:72,act:2,goal:0},foods:[],meals:m,weights:w,progs:P,logs,goals:{w:65,bench:100,freq:4},meas:[{d:dstr(30),waist:84,chest:99,arm:34,thigh:57},{d:dstr(0),waist:82,chest:99.5,arm:34.5,thigh:57.5}]}}
try{S=JSON.parse(localStorage.getItem("fitcoach1"))}catch(e){}
if(!S)S=demo();
const save=()=>{try{localStorage.setItem("fitcoach1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),r0=Math.round,r1=n=>Math.round(n*10)/10;
const allF=()=>F.concat(S.foods),fd=n=>allF().find(f=>f[0]==n);
function calc(p){const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=="m"?5:-161),tdee=bmr*MUL[p.act],adj=[-500,0,300][p.goal],k=r0(tdee+adj),pr=r0(p.w*(p.goal==0?2:1.8)),fa=r0(k*.27/9);return{bmr:r0(bmr),tdee:r0(tdee),adj,k,p:pr,f:fa,c:Math.max(0,r0((k-pr*4-fa*9)/4)),fib:30}}
function tot(d){const t={k:0,p:0,c:0,f:0,fib:0};(S.meals[d]||[]).forEach(i=>{const x=fd(i.f);if(!x)return;const q=i.g/100;t.k+=x[2]*q;t.p+=x[3]*q;t.c+=x[4]*q;t.f+=x[5]*q;t.fib+=(x[6]||0)*q});return t}
const vol=l=>l.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
const lastW=()=>S.weights.length?S.weights[S.weights.length-1].v:S.profile.w;
const pct=(a,b)=>b?Math.max(0,Math.min(100,a/b*100)):0;
function line(pts,labs){if(pts.length<2)return'<div class="mu">Pas encore assez de données.</div>';const W=320,H=130,mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1,x=i=>12+i*(W-24)/(pts.length-1),y=v=>H-22-(v-mn)/sp*(H-44);
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>${pts.map((v,i)=>pts.length<16?`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--ac)"/>`:"").join("")}<text x="2" y="12">${r1(mx)}</text><text x="2" y="${H-12}">${r1(mn)}</text><text x="12" y="${H-1}">${labs[0]}</text><text x="${W-12}" y="${H-1}" text-anchor="end">${labs[labs.length-1]}</text></svg>`}
function bars(v,labs){const W=320,H=120,mx=Math.max(...v,1),bw=(W-20)/v.length;return`<svg viewBox="0 0 ${W} ${H}" width="100%">${v.map((a,i)=>`<rect x="${10+i*bw+3}" y="${H-20-a/mx*(H-34)}" width="${bw-6}" height="${a/mx*(H-34)}" rx="4" fill="var(--ac)" opacity=".85"/><text x="${10+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${labs[i]}</text>`).join("")}</svg>`}
function ring(v,m,size=170){const R=70,C=2*Math.PI*R,p=Math.min(v/m,1);return`<svg viewBox="0 0 170 170" width="${size}" height="${size}"><circle cx="85" cy="85" r="${R}" stroke="var(--card2)" stroke-width="14" fill="none"/><circle cx="85" cy="85" r="${R}" stroke="${v>m?"var(--red)":"var(--ac)"}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 85 85)" style="transition:stroke-dasharray .8s"/></svg>`}
const mb=(n,v,m,col)=>`<div style="margin:8px 0"><div class="row sp mu"><span>${n}</span><span>${r0(v)} / ${m} g</span></div><div class="bar"><i style="width:${pct(v,m)}%;background:${col}"></i></div></div>`;
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:8px 16px;border-radius:20px;font-weight:700;z-index:20";document.body.append(e);setTimeout(()=>e.remove(),1600)}
const sheet=h=>{$("#sh").innerHTML='<div class="bk" onclick="cl()"></div><div class="pn">'+h+"</div>"},cl=()=>{$("#sh").innerHTML=""};
function go(v){view=v;render();scrollTo(0,0)}
function render(){S.recent=S.recent||[];S.fav=S.fav||[];S.routines=S.routines||[];S.cfg=S.cfg||{};const T=calc(S.profile),t=tot(TODAY),burn=S.logs.filter(l=>l.d==TODAY).reduce((a,l)=>a+l.dur*6,0);let h="";
if(view=="dash"){const nx=S.progs.length?S.progs[S.logs.length%S.progs.length]:null,rem=T.k+burn-t.k,w=lastW(),w0=S.weights[0]?S.weights[0].v:S.profile.w,w7=S.weights.slice(-45),l7=S.logs.filter(l=>l.d>=dstr(30)).length,avg=r0([1,2,3,4,5,6,7].reduce((a,i)=>a+tot(dstr(i)).k,0)/7),mk=id=>r0((S.meals[TODAY]||[]).filter(i=>i.m==id).reduce((a,i)=>{const x=fd(i.f);return a+(x?x[2]*i.g/100:0)},0));
const mc=(e,n,v,m,col)=>`<div class="c" style="padding:12px;margin:0"><div style="font-size:24px">${e}</div><div class="mu">${n}</div><b>${r0(v)}</b><span class="mu"> / ${m} g</span><div class="bar" style="margin-top:6px"><i style="width:${pct(v,m)}%;background:${col}"></i></div></div>`;
h=`<h1 style="margin-bottom:0">Bonjour 👋</h1><div class="mu" style="margin-bottom:12px">Voici ton résumé du jour</div><div class="c hero"><div class="row sp"><div style="flex:1;padding-right:10px"><div class="mu">CALORIES</div><div class="big">${r0(t.k)}<small> / ${T.k+burn} kcal</small></div><div class="bar" style="margin:8px 0"><i style="width:${pct(t.k,T.k+burn)}%"></i></div><b>${r0(Math.abs(rem))} kcal ${rem<0?"en trop":"restantes"}</b><div class="mu">🔥 ${burn} kcal brûlées</div></div>${ring2(t.k,T.k+burn)}</div></div>
<div class="g3" style="margin-bottom:12px">${mc("🥩","Protéines",t.p,T.p,"var(--blu)")}${mc("🍚","Glucides",t.c,T.c,"var(--ora)")}${mc("🥑","Lipides",t.f,T.f,"var(--vio)")}</div>
<div class="c"><h2>🍽️ Alimentation aujourd'hui</h2>${MEALS.map(([id,nm])=>`<div class="it" onclick="go('nut')"><span>${MI[id]} ${nm}</span><b>${mk(id)} kcal</b></div>`).join("")}<button class="b" style="margin-top:10px" onclick="go('nut')">+ Ajouter un aliment</button></div>
<div class="c"><h2>🏋️ Entraînement du jour</h2>${nx?`<div class="row sp"><div><div style="font-size:22px;font-weight:700">${esc(nx.name)}</div><div class="mu">${nx.ex.length} exercices · ~${nx.ex.reduce((a,e)=>a+e.sets,0)*3+10} min</div></div><button class="b sm" onclick="startS(${S.progs.indexOf(nx)})">Commencer</button></div>`:'<button class="b" onclick="go(\'train\')">Créer un programme</button>'}</div>
<div class="c"><h2>📈 Progression</h2><div class="g2"><div><div class="mu">Tour de taille</div><b>${S.meas.length?S.meas[S.meas.length-1].waist:"–"} cm</b></div><div><div class="mu">Séances (30 j)</div><b>${l7}</b></div><div><div class="mu">Calories moyennes</div><b>${avg} kcal</b></div><div><div class="mu">Record récent</div><b>${prTxt()}</b></div></div></div>
<div class="c"><div class="row sp"><h2>⚖️ Poids</h2><span class="mu">objectif ${S.goals.w} kg</span></div><div class="row" style="gap:18px"><div><div class="big">${w} kg</div><div class="mu">départ ${w0} · ${w-w0>0?"+":""}${r1(w-w0)} kg</div></div><div style="flex:1">${line(w7.map(x=>x.v),w7.map(x=>x.d.slice(5)))}</div></div></div>`}
else if(view=="nut"){h=`<h1>Nutrition</h1><div class="c hero"><div class="mu">Aujourd'hui</div><div class="big">${r0(t.k)}<small> / ${T.k} kcal</small></div><div>P ${r0(t.p)} g · G ${r0(t.c)} g · L ${r0(t.f)} g · Fib ${r0(t.fib)} g</div></div><button class="b" style="margin-bottom:12px" onclick="scan('')">📷 Scanner un produit</button>`;
MEALS.forEach(([id,nm])=>{const its=(S.meals[TODAY]||[]).map((i,ix)=>({...i,ix})).filter(i=>i.m==id);let s={k:0,p:0,c:0,f:0};its.forEach(i=>{const x=fd(i.f);if(x){s.k+=x[2]*i.g/100;s.p+=x[3]*i.g/100;s.c+=x[4]*i.g/100;s.f+=x[5]*i.g/100}});

function qtxt(i,f){const b=bs(f);return i.q&&i.u&&i.u!=b?`${i.q} ${i.u} (${i.g} ${b})`:`${i.g} ${b}`}
function dflt(f){const k=Object.keys(umap(f));return k.length?{q:1,u:k[0],g:umap(f)[k[0]]}:{q:100,u:bs(f),g:100}}
function ring2(v,m){const R=44,C=2*Math.PI*R,p=Math.min(v/m,1);return`<div style="position:relative;width:110px;height:110px"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="${R}" stroke="#ffffff40" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="${R}" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 55 55)" style="transition:stroke-dasharray .8s"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px">${r0(p*100)}%</div></div>`}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[m][n]}
function tok(t,n,nw,sy,sw){if(n==t)return 100;if(sy.includes(t))return 95;if(n.startsWith(t))return 85;if(nw.some(w=>w.startsWith(t)))return 70;if(sy.some(s=>s.startsWith(t))||sw.some(w=>w.startsWith(t)))return 65;
 if(t.length>=3&&n.includes(t))return 50;if(t.length>=3&&sy.some(s=>s.includes(t)))return 45;
 if(t.length>=4){let b=0;for(const w of nw.concat(sw)){const d=lev(t,w);if(d<=(t.length>6?2:1))b=Math.max(b,32-d*6);else if(w.length>=t.length&&lev(t,w.slice(0,t.length))<=1)b=Math.max(b,24)}return b}return 0}
function search(q){const ts=q.split(" ").filter(Boolean),out=[];if(!ts.length)return out;
 for(const f of allF()){const n=nz(f[0]),nw=n.split(" "),sy=((f[7]&&f[7].syn)||"").split(",").map(nz).filter(Boolean),sw=sy.join(" ").split(" ");let sum=0,ok=1;for(const t of ts){const x=tok(t,n,nw,sy,sw);if(!x){ok=0;break}sum+=x}if(ok)out.push([sum/ts.length+(n==q?20:0),f])}
 return out.sort((a,b)=>b[0]-a[0]||a[1][0].length-b[1][0].length).slice(0,30).map(x=>x[1])}
function row(f,x){return`<div class="it" data-n="${esc(f[0])}" onclick="pick(this.dataset.n)"><div class="row" style="gap:10px"><span style="font-size:26px">${em(f)}</span><span>${esc(f[0])}<div class="mu">${r0(f[2])} kcal / 100 ${bs(f)}</div></span></div>${x?x(f):""}</div>`}
function addF(m){cm=m;pmode="";searchSheet("Ajouter · "+MEALS.find(x=>x[0]==m)[1])}
function searchSheet(t){sheet(`<h2>${t}</h2><input id="q" placeholder="🔎 Rechercher (kiwi, poulet, riz…)" oninput="fs(this.value)">${pmode=="ph"?"":`<div class="chips" style="margin:10px 0"><button class="b2" onclick="photo()">📷 Photo</button><button class="b2" onclick="scan(cm)">▥ Scanner</button><button class="b2" onclick="rtSheet()">⭐ Mes repas</button></div>`}<div id="fr"></div>${pmode=="ph"?"":`<button class="b2" style="width:100%;margin-top:10px" onclick="newFood()">Créer mon aliment</button>`}`);fs("")}
function fs(q){q=nz(q);let h="";if(!q){const qk=pmode=="ph"?null:f=>`<button class="b2" data-n="${esc(f[0])}" onclick="event.stopPropagation();quick(this.dataset.n)">+</button>`,sec=(t,a,x)=>a.length?`<h2 style="margin:12px 0 4px">${t}</h2>`+a.map(f=>row(f,x)).join(""):"";
 h=sec("⭐ Favoris",S.fav.map(fd).filter(Boolean),qk)+sec("🕘 Récents",S.recent.map(fd).filter(Boolean).slice(0,8))+sec("🍎 Aliments courants",COMMON.map(fd).filter(Boolean))+sec("Mes aliments",S.foods.filter(f=>!(f[7]&&f[7].code)))}
 else h=search(q).map(f=>row(f)).join("")||`<p class="mu">Aucun résultat pour « ${esc(q)} ». Essaie un autre mot, scanne le produit ou crée ton aliment.</p>`;$("#fr").innerHTML=h}
function quick(n){const f=fd(n),d=dflt(f);(S.meals[TODAY]=S.meals[TODAY]||[]).push({m:cm,f:n,g:d.g,q:d.q,u:d.u});S.recent=[n,...S.recent.filter(a=>a!=n)].slice(0,15);save();cl();render();toast("Ajouté")}
function pick(n){if(pmode=="ph"){phAdd(n);return}eix=-1;pk=n;qsheet(dflt(fd(n)))}
function qsheet(d,edit){const f=fd(pk),m=umap(f),b=bs(f),us=[b,...Object.keys(m)];
 sheet(`<div class="row sp"><div class="row" style="gap:10px"><span style="font-size:34px">${em(f)}</span><div><h2 style="margin:0">${esc(pk)}</h2><div class="mu">Pour 100 ${b} : ${r0(f[2])} kcal · P ${f[3]} · G ${f[4]} · L ${f[5]} · Fib ${f[6]||0}</div></div></div><button class="b2" data-n="${esc(pk)}" onclick="tf(this)">${S.fav.includes(pk)?"★":"☆"}</button></div><div class="g2" style="margin-top:12px"><label class="mu">Quantité<input id="gq" type="number" inputmode="decimal" value="${d.q}" oninput="upd()"></label><label class="mu">Unité<select id="qu" onchange="upd()">${us.map(u=>`<option ${u==d.u?"selected":""}>${esc(u)}</option>`).join("")}</select></label></div><div id="mc" class="c" style="margin:10px 0"></div>${edit?"":`<label class="mu">Repas ${mealSel("pmm")}</label>`}<button class="b" style="margin-top:10px" onclick="confAdd()">${edit?"Enregistrer":"✓ Ajouter au repas"}</button>${edit?`<button class="b2" style="width:100%;margin-top:8px" onclick="delI(${eix});cl()">Supprimer</button>`:""}`);upd()}
function qg(){const f=fd(pk),m=umap(f),u=$("#qu").value,q=parseFloat($("#gq").value)||0;return{q,u,g:Math.round(q*(u==bs(f)?1:m[u])*10)/10}}
function upd(){const f=fd(pk),x=qg(),k=x.g/100;$("#mc").innerHTML=`<b style="font-size:22px">${r0(f[2]*k)} kcal</b> <span class="mu">(${x.g} ${bs(f)})</span><div class="mu">Protéines ${r1(f[3]*k)} g · Glucides ${r1(f[4]*k)} g · Lipides ${r1(f[5]*k)} g · Fibres ${r1((f[6]||0)*k)} g</div>`}
function confAdd(){const x=qg();if(!(x.g>0)){toast("Quantité invalide");return}
 if(eix>=0)Object.assign(S.meals[TODAY][eix],{g:x.g,q:x.q,u:x.u});else{(S.meals[TODAY]=S.meals[TODAY]||[]).push({m:cm,f:pk,g:x.g,q:x.q,u:x.u});S.recent=[pk,...S.recent.filter(n=>n!=pk)].slice(0,15)}
 save();cl();render();toast(eix>=0?"Modifié":"Ajouté")}
function editI(ix){const it=S.meals[TODAY][ix],f=it&&fd(it.f);if(!f)return;eix=ix;pk=it.f;qsheet({q:it.q||it.g,u:it.u||bs(f)},1)}
// repas favoris
function rtSave(m){cm=m;sheet(`<h2>⭐ Enregistrer ce repas</h2><input id="rn" placeholder="Nom (ex : Petit-déj habituel)"><button class="b" style="margin-top:10px" onclick="rtGo('${m}')">Enregistrer</button>`)}
function rtGo(m){const n=$("#rn").value.trim();if(!n){toast("Donne un nom");return}S.routines.push({name:n,items:(S.meals[TODAY]||[]).filter(i=>i.m==m).map(i=>({f:i.f,g:i.g,q:i.q,u:i.u}))});save();cl();toast("Repas enregistré")}
function rtSheet(){rtc=[];S.routines.forEach((r,i)=>rtc.push({t:"⭐ "+r.name,items:r.items,i}));let n=0;for(let d=1;d<=14&&n<4;d++){const its=(S.meals[dstr(d)]||[]).filter(i=>i.m==cm);if(its.length){rtc.push({t:"🕘 "+dstr(d).slice(5),items:its.map(i=>({f:i.f,g:i.g,q:i.q,u:i.u}))});n++}}
 sheet(`<h2>Mes repas · ${MEALS.find(x=>x[0]==cm)[1]}</h2>`+(rtc.map((r,k)=>{const K=r.items.reduce((a,i)=>{const x=fd(i.f);return a+(x?x[2]*i.g/100:0)},0);return`<div class="it"><div>${esc(r.t)}<div class="mu">${r.items.length} aliments · ${r0(K)} kcal</div></div><div class="row"><button class="b sm" onclick="rtAdd(${k})">Ajouter</button>${r.i!=null?`<button class="b2" onclick="rtDel(${r.i})">✕</button>`:""}</div></div>`}).join("")||'<p class="mu">Aucun repas pour l\'instant. Utilise ⭐ Enregistrer sur un repas.</p>'))}
function rtAdd(k){const L=S.meals[TODAY]=S.meals[TODAY]||[];rtc[k].items.filter(i=>fd(i.f)).forEach(i=>L.push({m:cm,f:i.f,g:i.g,q:i.q,u:i.u}));save();cl();render();toast("Repas ajouté")}
function rtDel(i){S.routines.splice(i,1);save();rtSheet()}
// photo
function photo(){sheet(`<h2>📷 Photo d'un aliment</h2><p class="mu">La photo sert à identifier les aliments. Tu indiques toi-même les quantités.</p><label class="b" style="display:block;text-align:center">📷 Prendre une photo<input type="file" accept="image/*" capture="environment" hidden onchange="onPhoto(this.files[0])"></label><label class="b2" style="display:block;text-align:center;margin-top:8px">🖼️ Choisir dans la galerie<input type="file" accept="image/*" hidden onchange="onPhoto(this.files[0])"></label>`)}
function resize(file){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.8))};im.onerror=ko;im.src=u})}
async function onPhoto(file){if(!file)return;ph={img:null,rows:[],st:"load",msg:""};phView();
 try{ph.img=await resize(file)}catch(e){ph.st="err";ph.msg="Image illisible.";return phView()}
 const c=S.cfg||{};if(!c.url){ph.st="manual";return phView()}
 try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),30000),r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json",...(c.token?{"X-FitCoach-Key":c.token}:{})},body:JSON.stringify({image:ph.img.split(",")[1]}),signal:ac.signal});clearTimeout(t);if(!r.ok)throw 0;const j=await r.json();
  ph.rows=(j.foods||[]).slice(0,8).map(d=>{const f=search(nz(d.name))[0];return{f:f?f[0]:null,lbl:d.name,conf:d.confidence||"moyenne",g:f?dflt(f).g:100}});ph.st=ph.rows.length?"ok":"empty"}catch(e){ph.st="err";ph.msg="Analyse impossible (réseau ou serveur)."}phView()}
function phView(){const p=ph;if(!p)return;const msg={load:"Analyse en cours…",manual:"Analyse automatique non configurée : ajoute les aliments toi-même (réglage dans Profil).",empty:"Aucun aliment reconnu. Ajoute-les toi-même.",err:p.msg,ok:"Je pense avoir détecté (estimation, corrige si besoin) :"}[p.st];
 sheet(`<h2>📷 Aliments de la photo</h2>${p.img?`<img src="${p.img}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:14px">`:""}<p class="mu">${msg}</p>${p.rows.map((r,i)=>{const f=r.f&&fd(r.f);return`<div class="it" style="gap:6px"><div style="flex:1">${f?em(f)+" "+esc(r.f):"❓ "+esc(r.lbl)}<div class="mu">${f?"Confiance : "+esc(r.conf):"Non trouvé : choisis un aliment"}</div></div>${f?`<input type="number" inputmode="decimal" style="width:80px" value="${r.g}" onchange="ph.rows[${i}].g=+this.value;phSum()"><span class="mu">${bs(f)}</span>`:""}<button class="b2" onclick="phSearch(${i})">${f?"↻":"Choisir"}</button><button class="b2" onclick="ph.rows.splice(${i},1);phView()">✕</button></div>`}).join("")}<button class="b2" style="width:100%;margin-top:8px" onclick="phSearch(-1)">+ Ajouter un aliment</button><div id="phs" class="c" style="margin:10px 0"></div><label class="mu">Repas ${mealSel("phm")}</label><button class="b" style="margin-top:10px" onclick="phGo()">✓ Ajouter au repas</button>`);phSum()}
function phSum(){let k=0,p=0,c=0,l=0,fb=0;ph.rows.forEach(r=>{const f=r.f&&fd(r.f);if(f){const q=r.g/100;k+=f[2]*q;p+=f[3]*q;c+=f[4]*q;l+=f[5]*q;fb+=(f[6]||0)*q}});$("#phs").innerHTML=`<b>${r0(k)} kcal</b><div class="mu">P ${r1(p)} g · G ${r1(c)} g · L ${r1(l)} g · Fib ${r1(fb)} g</div>`}
function phSearch(i){phIdx=i;pmode="ph";searchSheet("Choisir un aliment")}
function phAdd(n){const r={f:n,lbl:n,conf:phIdx>=0?"corrigé":"ajouté",g:dflt(fd(n)).g};phIdx>=0?ph.rows[phIdx]=r:ph.rows.push(r);pmode="";phView()}
function phGo(){const L=S.meals[TODAY]=S.meals[TODAY]||[];let n=0;ph.rows.forEach(r=>{if(r.f&&fd(r.f)&&r.g>0){L.push({m:cm,f:r.f,g:r.g});S.recent=[r.f,...S.recent.filter(a=>a!=r.f)].slice(0,15);n++}});if(!n){toast("Aucun aliment valide");return}save();ph=null;cl();render();toast(n+" aliment(s) ajouté(s)")}
function saveCfg(){const u=$("#cf_u").value.trim();if(u&&!u.startsWith("https://")){toast("L'adresse doit commencer par https://");return}S.cfg={url:u,token:$("#cf_t").value.trim()};save();toast("Enregistré")}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script></body></html>
